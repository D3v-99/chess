<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Chess Coach</title>
    <link rel="stylesheet" href="ui.css" />
    <style>
      body { width: 320px; padding: 14px; }
      .card { padding: 12px; margin-bottom: 10px; }
      .disclaimer { padding: 10px 12px; margin-bottom: 10px; font-size: 12.5px; }
      .row { grid-template-columns: 110px 1fr; margin-bottom: 8px; }
      #fen { display: block; margin-top: 6px; }
      h1 { font-size: 16px; }
    </style>
  </head>
  <body>
    <h1>Chess Coach</h1>
    <div class="disclaimer">
      <strong>Educational use only.</strong> Using this in rated games violates chess.com's Terms of Service.
    </div>

    <div class="card">
      <label class="check"><input type="checkbox" id="enabled" /> <span>Enabled</span></label>
      <label class="check"><input type="checkbox" id="hoverExplanations" /> <span>Hover explanations</span></label>
      <div class="row">
        <label for="sideOverride">Side to move</label>
        <select id="sideOverride">
          <option value="auto">Auto-detect</option>
          <option value="w">White</option>
          <option value="b">Black</option>
        </select>
      </div>
      <div class="status err" id="overrideWarn" hidden>
        Only <span id="overrideSide"></span> pieces respond to hover. Use Auto-detect unless the turn is detected wrongly.
      </div>
    </div>

    <div class="card">
      <div class="status" id="pageStatus">Checking this tab…</div>
      <div class="status" id="engineStatus"></div>
      <code id="fen"></code>
      <div class="actions" style="margin-top: 8px">
        <button id="copyFen" type="button" hidden>Copy FEN</button>
        <button id="options" type="button">Options</button>
      </div>
      <details id="diagBox" hidden style="margin-top: 8px">
        <summary class="status">Diagnose this tab</summary>
        <pre id="diag" class="mono" style="white-space: pre-wrap; margin: 6px 0 0"></pre>
      </details>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
